name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 解决 GitHub Actions “Node.js 20 deprecated” 的迁移提示：提前强制用 Node.js 24 运行 JS Actions
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Generate snake SVG
        # 使用 v3.x 最新版本（tag 内部仍属于 v3 系列）
        uses: Platane/snk/svg-only@v3.4.1
        with:
          github_user_name: TTlook111
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        # v5 已更新为 Node 24 runtime（减少未来兼容风险）
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
